# Closes bug reports that still have the needs-info label (triage.yml) after 7 days without any change.
# Nothing else is ever marked or closed: issues without needs-info and pull requests are left alone.
name: Close reports missing information

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          only-labels: needs-info
          days-before-issue-stale: 7
          days-before-issue-close: 0
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: ""
          close-issue-message: >-
            Closed because the information asked for above (savagewind.log, the latest release or game version 1.9.0)
            didn't arrive within 7 days. If you still see the bug, reopen this issue or open a new one with it.
          close-issue-reason: not_planned
